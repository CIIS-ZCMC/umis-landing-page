<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" fill="none">
  <defs>
    <linearGradient id="snowGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#edf5fb" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c4e0f6" stop-opacity="0.90"/>
    </linearGradient>
    <radialGradient id="dropGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="60%" stop-color="#d7ebfa" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#a4ceef" stop-opacity="0.92"/>
    </radialGradient>
  </defs>
  <!-- Snow body resting on edge (y=20), tapers down into drip stem at x=52 -->
  <path d="M4,20 C14,14 28,10 44,11 C58,12 68,9 82,10 C92,11 96,16 97,20 L64,20 C60,20 58,22 56,26 C54,30 54,32 52,32 C50,32 50,30 48,26 C46,22 42,20 20,20 Z" fill="url(#snowGrad4)"/>
  <!-- Crisp top highlight -->
  <path d="M8,16 C22,12 36,11 54,12 C70,13 82,11 92,15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  <!-- Suspended melting water droplet just below the drip tip -->
  <ellipse cx="52" cy="36" rx="2.2" ry="2.8" fill="url(#dropGrad)"/>
  <circle cx="51.2" cy="35" r="0.8" fill="#ffffff" opacity="0.95"/>
</svg>
